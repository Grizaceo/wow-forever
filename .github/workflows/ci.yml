name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Mínimos privilegios: el workflow solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El navegador se instala explícitamente en el job de gates (una sola vez).
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Node tests (repo logic)
        run: node --test tests/
      - name: Node tests (standalone engine)
        run: >-
          node --test
          standalone/tests/market.cjs
          standalone/tests/market-history.cjs
          standalone/tests/market-deals.cjs
          standalone/tests/market-chart.cjs
          standalone/tests/market-farm.cjs
          standalone/tests/market-farm-routing.cjs
      - name: Python tests (unittest)
        run: python -m unittest discover -s tests
      - name: Reproducible desktop build
        run: npm run build
        working-directory: desktop
      - name: Bundle contract check
        run: python scripts/check_desktop_bundle.py desktop/plugin.js

  gates-linux:
    name: gates (linux + lua + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Install pinned desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: desktop
      - name: Canonical gates (counts + build + browser + lua)
        run: node scripts/run-gates.mjs --keep-going
